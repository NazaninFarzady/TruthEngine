        function App() {
            // Navigation State
            const [role, setRole] = useState('founder'); // 'founder' or 'director'
            const [activeTab, setActiveTab] = useState('auditor'); // founder: 'auditor', 'simulator', 'pipeline' | director: 'cohort', 'tranches'
            
            // App Data State
            const [candidates, setCandidates] = useState(INITIAL_CANDIDATES);
            const [portfolio, setPortfolio] = useState(INITIAL_PORTFOLIO);
            const [selectedCandidateId, setSelectedCandidateId] = useState('cand-3');
            const [inspectCandidate, setInspectCandidate] = useState(null); // For modal
            const [searchQuery, setSearchQuery] = useState('');
            const [filterStatus, setFilterStatus] = useState('all');
            const [toast, setToast] = useState(null);
            const [showLpCertModal, setShowLpCertModal] = useState(false);

            // Audit Form State
            const [candidateName, setCandidateName] = useState(SAMPLE_A_POLITE.name);
            const [candidateRole, setCandidateRole] = useState(SAMPLE_A_POLITE.role);
            const [candidateCompany, setCandidateCompany] = useState(SAMPLE_A_POLITE.company);
            const [candidateType, setCandidateType] = useState(SAMPLE_A_POLITE.type);
            const [candidateStartup, setCandidateStartup] = useState("Spotted");
            const [transcriptInput, setTranscriptInput] = useState(SAMPLE_A_POLITE.transcript);
            const [isAuditing, setIsAuditing] = useState(false);
            const [auditResult, setAuditResult] = useState(null);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3200);
            };

            // Switch role
            const handleSwitchRole = (newRole) => {
                setRole(newRole);
                if (newRole === 'founder') {
                    setActiveTab('auditor');
                } else {
                    setActiveTab('cohort');
                }
            };

            // Load presets into Step 1
            const handleLoadPreset = (preset) => {
                setCandidateName(preset.name);
                setCandidateRole(preset.role);
                setCandidateCompany(preset.company);
                setCandidateType(preset.type);
                setCandidateStartup(preset.startup);
                setTranscriptInput(preset.transcript);
                setAuditResult(null);
                showToast(`Loaded Preset: ${preset.name} (${preset.company})`);
            };

            // Run Audit Engine
            const handleRunAudit = () => {
                if (!transcriptInput.trim()) {
                    showToast("Please enter an interview transcript first.");
                    return;
                }

                setIsAuditing(true);

                setTimeout(() => {
                    const text = transcriptInput.toLowerCase();
                    const pastKeywords = ['last', 'spent', 'lost', 'paid', 'paying', 'currently', 'hours', 'yesterday', 'cost us', 'hired', 'macro', 'excel', 'google sheet', 'strips', 'ruins'];
                    const futureKeywords = ['would', 'could', 'in theory', 'if you', 'probably', 'maybe', 'think', 'sounds', 'should', 'cool idea', 'amazing', 'love it', 'nice value-add'];
                    const workaroundKeywords = ['macro', 'excel', 'sheet', 'intern', 'agency', 'custom', 'manually', 'pay', 'paying', 'legacy', 'finger-pricks'];

                    let pastCount = 0;
                    let futureCount = 0;
                    let workaroundCount = 0;

                    pastKeywords.forEach(k => { if (text.includes(k)) pastCount += 2; });
                    futureKeywords.forEach(k => { if (text.includes(k)) futureCount += 1.5; });
                    workaroundKeywords.forEach(k => { if (text.includes(k)) workaroundCount += 2; });

                    const hasPastFacts = pastCount >= futureCount;
                    const hasWorkaround = workaroundCount > 0 || text.includes('pay') || text.includes('lost');
                    const isVaguePraise = futureCount > pastCount && !hasWorkaround;

                    let score = 50;
                    if (hasPastFacts) score += 25; else score -= 20;
                    if (hasWorkaround) score += 25; else score -= 20;
                    if (isVaguePraise) score -= 15; else score += 10;

                    score = Math.max(15, Math.min(98, score));
                    const verdict = score >= 60 ? 'painkiller' : 'vitamin';
                    const timeHorizon = hasPastFacts ? 'past' : 'future';
                    const workaround = hasWorkaround ? 'active' : 'none';
                    const sentimentType = isVaguePraise ? 'vague_praise' : 'specific_friction';

                    let frictionLinkType = 'deposit';
                    if (candidateType === 'B2B') frictionLinkType = 'intro';
                    else if (candidateType === 'EarlyAccess') frictionLinkType = 'onboarding';

                    let emailDraft = "";
                    if (candidateType === 'B2B') {
                        emailDraft = `Hi ${candidateName.split(' ')[0]}, thanks for detailing the operational friction your team experiences at ${candidateCompany}. We are taking on 3 Design Partners for our pilot next week. Can you introduce me to your department decision-maker today so we can lock in your setup?`;
                    } else if (candidateType === 'EarlyAccess') {
                        emailDraft = `Hi ${candidateName.split(' ')[0]}, thanks for the feedback! Book your 15-minute onboarding setup call for next Tuesday here to connect your account: https://truthengine.app/setup/${candidateCompany.toLowerCase().replace(/\s+/g, '')}`;
                    } else {
                        emailDraft = `Hi ${candidateName.split(' ')[0]}, glad you liked our concept! You mentioned high interest in this solution. We are taking $1 refundable pre-orders to prioritize our early-access cohort. Here is your reservation link: https://truthengine.app/r/${candidateName.toLowerCase().replace(/\s+/g, '-')}`;
                    }

                    const result = {
                        id: `cand-${Date.now()}`,
                        startup: candidateStartup,
                        name: candidateName || "Anonymous Candidate",
                        role: candidateRole || "Founder",
                        company: candidateCompany || "Startup Inc",
                        type: candidateType,
                        transcript: transcriptInput,
                        verdict,
                        score,
                        timeHorizon,
                        workaround,
                        sentimentType,
                        frictionStatus: 'pending',
                        frictionLinkType,
                        actionTimestamp: "Just now",
                        emailDraft
                    };

                    setAuditResult(result);
                    setIsAuditing(false);
                    showToast("Linguistic Audit Complete!");
                }, 500);
            };

            // Push Audited Result to Pipeline
            const handlePushToPipeline = () => {
                if (!auditResult) return;
                setCandidates(prev => [auditResult, ...prev]);
                setSelectedCandidateId(auditResult.id);
                setActiveTab('simulator');
                showToast(`Pushed ${auditResult.name} to Step 2 Action Simulator!`);
            };

            // Simulate Action
            const handleSimulateAction = (id, newStatus) => {
                setCandidates(prev => prev.map(c => {
                    if (c.id === id) {
                        return {
                            ...c,
                            frictionStatus: newStatus,
                            actionTimestamp: newStatus === 'verified_painkiller' ? 'Action Taken (Paid Deposit / Intro Made)' : 'Expired (48h Ignored)'
                        };
                    }
                    return c;
                }));

                const statusLabel = newStatus === 'verified_painkiller' ? 'VERIFIED PAINKILLER' : 'POLITE FALSE POSITIVE';
                showToast(`Candidate updated to: ${statusLabel}`);
            };

            // Calculated Metrics
            const metrics = useMemo(() => {
                const total = candidates.length;
                const verifiedPainkillers = candidates.filter(c => c.frictionStatus === 'verified_painkiller').length;
                const politePositives = candidates.filter(c => c.frictionStatus === 'polite_false_positive').length;
                const pending = candidates.filter(c => c.frictionStatus === 'pending').length;
                const conversionRate = total > 0 ? ((verifiedPainkillers / total) * 100).toFixed(0) : 0;
                const falsePositiveRate = total > 0 ? ((politePositives / (verifiedPainkillers + politePositives || 1)) * 100).toFixed(0) : 0;

                return { total, verifiedPainkillers, politePositives, pending, conversionRate, falsePositiveRate };
            }, [candidates]);

                return candidates.find(c => c.id === selectedCandidateId) || candidates[0];
            }, [candidates, selectedCandidateId]);

            const filteredCandidates = useMemo(() => {
                return candidates.filter(c => {

                    return matchesSearch && matchesStatus;
                });
            }, [candidates, searchQuery, filterStatus]);

                        <div className="space-y-6">
                            
                            {/* BRAND HEADER */}
                            <div className="flex items-center space-x-3 px-2 py-2 border-b border-slate-100 pb-4">
                                <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-black text-xl shadow-md shadow-indigo-200">

                                                <div key={idx} className="border border-slate-200 rounded-xl p-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-50">
                                                    <div className="space-y-1">
                                                        <div className="flex items-center space-x-2">
                                                            <h4 className="text-sm font-extrabold text-slate-900">{p.name}</h4>
                                                            <span className="text-[10px] text-slate-500 font-semibold">• {p.tagline}</span>
                                                        </div>
                                                        <p className="text-xs text-slate-600">Founder: <span className="font-semibold">{p.founder}</span> | Stage: <span className="font-semibold">{p.stage}</span></p>
                                                        <p className="text-[11px] text-slate-500">Reason: {p.trancheReason}</p>
                                                    </div>

                                                    <div className="flex items-center space-x-4 w-full md:w-auto justify-between md:justify-end">
                                                        <div className="text-right">
                                                            <p className="text-[10px] font-bold text-slate-400 uppercase">Capital at Risk</p>
                                                            <p className="text-sm font-extrabold text-slate-900 font-mono">{p.capitalAtRisk}</p>
                                                        </div>

                                                        <div className="flex items-center space-x-2">
                                                            <span className={`text-xs font-bold px-3 py-1.5 rounded-xl border ${
                                                                p.trancheStatus === 'APPROVED' ? 'bg-emerald-100 text-emerald-800 border-emerald-300' :
                                                                p.trancheStatus === 'PAUSED' ? 'bg-rose-100 text-rose-800 border-rose-300' :
                                                                'bg-amber-100 text-amber-800 border-amber-300'
                                                            }`}>
                                                                {p.trancheStatus}
                                                            </span>

                                                            <button
                                                                type="button"
                                                                onClick={() => handleToggleTranche(p.name)}
                                                                className="text-xs bg-white hover:bg-slate-100 border border-slate-300 px-3 py-1.5 rounded-xl font-semibold transition shadow-xs"
                                                            >
                                                                Toggle Status
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>

                    {/* MODAL: INSPECT CANDIDATE */}
                    {inspectCandidate && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                    <div>
                                        <h3 className="text-sm font-bold text-slate-900">Candidate Audit Deep-Dive</h3>
                                        <p className="text-xs text-slate-500">{inspectCandidate.name} ({inspectCandidate.company})</p>
                                    </div>
                                    <button
                                        onClick={() => setInspectCandidate(null)}
                                        className="text-slate-400 hover:text-slate-700 p-1"
                                    >
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="space-y-3 text-xs">
                                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                        <span className="text-[10px] font-bold text-slate-400 uppercase">Raw Transcript Quote</span>
                                        <p className="font-mono text-slate-800 mt-1 italic">"{inspectCandidate.transcript}"</p>
                                    </div>

                                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                                        <span className="text-[10px] font-bold text-slate-400 uppercase">Step 2 Action Dispatch Email</span>
                                        <p className="font-mono text-slate-800 mt-1">{inspectCandidate.emailDraft}</p>
                                    </div>
                                </div>

                                <div className="flex justify-end pt-2">
                                    <button
                                        type="button"
                                        onClick={() => setInspectCandidate(null)}
                                        className="bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs px-4 py-2 rounded-xl transition"
                                    >
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: LP RISK CERTIFICATE */}
                    {showLpCertModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 flex items-center justify-center p-4">
                            <div className="bg-white border border-slate-200 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                                    <div className="flex items-center space-x-2">
                                        <Icon name="award" className="w-5 h-5 text-emerald-600" />
                                        <h3 className="text-sm font-bold text-slate-900">LP Risk Compliance Certificate</h3>
                                    </div>
                                    <button
                                        onClick={() => setShowLpCertModal(false)}
                                        className="text-slate-400 hover:text-slate-700 p-1"
                                    >
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4 space-y-2 text-xs text-emerald-900">
                                    <p className="font-bold">Cryptographically Verified Batch Audit Report</p>
                                    <p className="text-[11px] leading-relaxed">
                                        This batch report certifies that 400,000 NOK in investor tranche capital is currently protected by Guardrail Gatekeeper rules until behavioral proof is provided.
                                    </p>
                                </div>

                                <div className="flex justify-end space-x-2 pt-2">
                                    <button
                                        type="button"
                                        onClick={() => {
                                            showToast("Downloading signed LP Certificate PDF...");
                                            setShowLpCertModal(false);
                                        }}
                                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs px-4 py-2 rounded-xl transition flex items-center space-x-1.5"
                                    >
                                        <Icon name="download" className="w-4 h-4" />
                                        <span>Download Signed PDF</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
